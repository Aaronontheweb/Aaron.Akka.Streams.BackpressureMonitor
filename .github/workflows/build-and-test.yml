name: build and test

on:
  push:
  pull_request:
    branches: [ master, dev ]
    paths:
    - '**.cs'
    - '**.csproj'
    - 'global.json'

jobs:
  build-and-test:
    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Run FAKE
      run: ./build.cmd all